<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Animal com Tutor</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="email"], input[type="number"], select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        .form-section { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Cadastrar Animal com Tutor</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-section">
            <h2>Informações do Animal</h2>
            <label for="numero_chip">Número do Microchip:</label>
            <input type="text" id="numero_chip" name="numero_chip" required>

            <label for="nome_animal">Nome do Animal:</label>
            <input type="text" id="nome_animal" name="nome_animal">

            <label for="especie">Espécie:</label>
            <input type="text" id="especie" name="especie" required>

            <label for="raca">Raça:</label>
            <input type="text" id="raca" name="raca">

            <label for="idade">Idade (anos):</label> <!-- Ou data de nascimento -->
            <input type="number" id="idade" name="idade">

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo">
                <option value="M">Macho</option>
                <option value="F">Fêmea</option>
            </select>

            <label for="porte">Porte:</label>
            <input type="text" id="porte" name="porte" placeholder="Pequeno, Médio, Grande">

            <label for="saude">Saúde (Vacinas, Castração, Condições):</label>
            <textarea id="saude" name="saude" rows="3"></textarea>

            <label for="historico">Histórico:</label>
            <textarea id="historico" name="historico" rows="3"></textarea>
        </div>

        <div class="form-section">
            <h2>Informações do Tutor</h2>
            <label for="nome_tutor">Nome do Tutor:</label>
            <input type="text" id="nome_tutor" name="nome_tutor" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required placeholder="XXX.XXX.XXX-XX">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required>

            <label for="endereco">Endereço Completo:</label>
            <textarea id="endereco" name="endereco" rows="3" required></textarea>
        </div>

        <button type="submit">Cadastrar Animal</button>
    </form>

    <p><a href="{{ url_for('main.index') }}">Voltar para Consulta</a></p>

</body>
</html>
